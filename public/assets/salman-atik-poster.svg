<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="videoBgGrad" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="overlayGlow" x1="0" y1="360" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0AC79E" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="videoPosterShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 16:9 Poster Background -->
  <rect width="640" height="360" rx="16" fill="url(#videoBgGrad)"/>
  <rect width="640" height="360" rx="16" fill="url(#overlayGlow)"/>

  <!-- Subtle Shop Environment Silhouettes in Background -->
  <g opacity="0.15">
    <rect x="60" y="80" width="140" height="180" rx="6" fill="#FFFFFF"/>
    <rect x="230" y="60" width="180" height="200" rx="6" fill="#FFFFFF"/>
    <rect x="440" y="90" width="140" height="170" rx="6" fill="#FFFFFF"/>
    <line x1="0" y1="280" x2="640" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- POS Terminal Silhouette in Foreground -->
  <g transform="translate(430, 150)" opacity="0.3" filter="url(#videoPosterShadow)">
    <rect width="130" height="90" rx="8" fill="#334155"/>
    <rect x="6" y="6" width="118" height="78" rx="4" fill="#0F172A"/>
    <rect x="16" y="16" width="60" height="8" rx="2" fill="#2563EB"/>
    <rect x="16" y="32" width="98" height="6" rx="2" fill="#64748B"/>
    <rect x="16" y="44" width="80" height="6" rx="2" fill="#64748B"/>
  </g>

  <!-- Interview Speaker Profile Silhouette -->
  <g transform="translate(100, 70)" opacity="0.85">
    <!-- Head -->
    <ellipse cx="90" cy="80" rx="36" ry="44" fill="#334155"/>
    <!-- Shoulders -->
    <path d="M10 210 C10 150 50 140 90 140 C130 140 170 150 170 210 Z" fill="#1E293B"/>
  </g>

  <!-- Video Play Watermark Badge in Center -->
  <g transform="translate(270, 130)" filter="url(#videoPosterShadow)">
    <circle cx="50" cy="50" r="42" fill="#2563EB" fill-opacity="0.95"/>
    <circle cx="50" cy="50" r="48" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Play Triangle -->
    <polygon points="42,34 68,50 42,66" fill="#FFFFFF"/>
  </g>

  <!-- Lower Title Bar / Video Info Overlay -->
  <rect x="0" y="270" width="640" height="90" fill="#0B132B" fill-opacity="0.85"/>
  <text x="32" y="305" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Salman Atik — Super Shop Operational Walkthrough</text>
  <text x="32" y="332" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Owner, Dhaka Retail &amp; Grocery • 2:45 min interview</text>
  <rect x="530" y="295" width="78" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="569" y="314" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0AC79E" text-anchor="middle">2:45 MIN</text>
</svg>
