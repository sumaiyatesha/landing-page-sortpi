<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="contactBgGrad" x1="0" y1="0" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="480" height="380" rx="20" fill="url(#contactBgGrad)"/>

  <!-- Decorative Dot Pattern behind content (inspired by Image 3) -->
  <g fill="#CBD5E1" opacity="0.6">
    <circle cx="380" cy="40" r="2.5"/>
    <circle cx="400" cy="40" r="2.5"/>
    <circle cx="420" cy="40" r="2.5"/>
    <circle cx="380" cy="60" r="2.5"/>
    <circle cx="400" cy="60" r="2.5"/>
    <circle cx="420" cy="60" r="2.5"/>
    <circle cx="380" cy="80" r="2.5"/>
    <circle cx="400" cy="80" r="2.5"/>
    <circle cx="420" cy="80" r="2.5"/>
  </g>

  <!-- Support Team Workstation & POS Terminal Scene -->
  <!-- Support Desk Surface -->
  <path d="M40 280 L440 280 L420 340 L60 340 Z" fill="#E2E8F0" opacity="0.7"/>
  <rect x="40" y="274" width="400" height="6" rx="3" fill="#94A3B8"/>

  <!-- Central Workstation Monitor -->
  <g transform="translate(140, 100)" filter="url(#cardShadow)">
    <rect width="200" height="140" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <!-- Screen View -->
    <rect x="8" y="8" width="184" height="114" rx="6" fill="#F8FAFC"/>
    <!-- Software UI Header -->
    <rect x="8" y="8" width="184" height="20" rx="4" fill="#2563EB"/>
    <text x="18" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">SortPi Support Desk</text>
    <circle cx="178" cy="18" r="3" fill="#0AC79E"/>
    <!-- Inquiry Queue Mockup -->
    <rect x="18" y="38" width="80" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="18" y="56" width="140" height="8" rx="2" fill="#E2E8F0"/>
    <rect x="18" y="70" width="110" height="8" rx="2" fill="#E2E8F0"/>
    <rect x="18" y="84" width="130" height="8" rx="2" fill="#E2E8F0"/>
    <!-- Active status -->
    <rect x="18" y="100" width="70" height="14" rx="4" fill="#E6FAF5"/>
    <text x="36" y="110" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#065F46">Dhaka Team</text>
    <!-- Stand -->
    <rect x="90" y="140" width="20" height="24" fill="#475569"/>
    <rect x="70" y="164" width="60" height="6" rx="2" fill="#334155"/>
  </g>

  <!-- Left: Direct Phone Card Badge -->
  <g transform="translate(48, 150)" filter="url(#cardShadow)">
    <rect width="110" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#EFF6FF"/>
    <path d="M23 27 C23 35 29 41 37 41" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="28" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0F172A">Direct Call</text>
    <text x="50" y="42" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#64748B">+88 01341...</text>
  </g>

  <!-- Right: Email Channel Badge -->
  <g transform="translate(322, 170)" filter="url(#cardShadow)">
    <rect width="110" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="32" r="14" fill="#E6FAF5"/>
    <rect x="20" y="26" width="16" height="12" rx="2" stroke="#0AC79E" stroke-width="1.5" fill="none"/>
    <path d="M20 28 L28 33 L36 28" stroke="#0AC79E" stroke-width="1.5"/>
    <text x="50" y="28" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0F172A">Email Us</text>
    <text x="50" y="42" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#64748B">contact@...</text>
  </g>
</svg>
