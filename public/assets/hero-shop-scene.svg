<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" width="100%" height="100%">
  <!-- Background Ambient Glow & Grid -->
  <defs>
    <linearGradient id="heroBgGrad" x1="0" y1="0" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0AC79E"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="520" rx="24" fill="url(#heroBgGrad)"/>

  <!-- Subtle Shop Interior Props (Secondary Background Context) -->
  <!-- Top Shelf -->
  <rect x="40" y="44" width="560" height="8" rx="4" fill="#CBD5E1"/>
  <!-- Stock Items on Top Shelf -->
  <rect x="60" y="24" width="28" height="20" rx="3" fill="#93C5FD"/>
  <rect x="94" y="20" width="22" height="24" rx="3" fill="#BAE6FD"/>
  <rect x="122" y="26" width="30" height="18" rx="3" fill="#A7F3D0"/>
  <rect x="480" y="22" width="24" height="22" rx="3" fill="#FDE68A"/>
  <rect x="510" y="20" width="32" height="24" rx="3" fill="#93C5FD"/>
  <rect x="548" y="24" width="26" height="20" rx="3" fill="#CBD5E1"/>

  <!-- Shop Floor Counter Stand (Secondary) -->
  <path d="M40 380 L600 380 L580 470 L60 470 Z" fill="#E2E8F0" opacity="0.6"/>
  <rect x="40" y="372" width="560" height="8" rx="4" fill="#94A3B8"/>

  <!-- Physical POS Peripheral Props (Receipt Printer & Scanner) -->
  <!-- Thermal Receipt Printer -->
  <g transform="translate(68, 300)" filter="url(#softShadow)">
    <rect width="80" height="72" rx="8" fill="#1E293B"/>
    <rect x="8" y="10" width="64" height="8" rx="2" fill="#0F172A"/>
    <!-- Paper Receipt Coming Out -->
    <path d="M16 12 L64 12 L64 -25 L56 -21 L48 -25 L40 -21 L32 -25 L24 -21 L16 -25 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="22" y1="-12" x2="58" y2="-12" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="-4" x2="48" y2="-4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Indicator LED -->
    <circle cx="20" cy="54" r="3" fill="#0AC79E"/>
    <circle cx="32" cy="54" r="3" fill="#64748B"/>
  </g>

  <!-- Handheld Barcode Scanner on Dock -->
  <g transform="translate(500, 290)" filter="url(#softShadow)">
    <path d="M20 70 L40 70 L34 40 L26 40 Z" fill="#334155"/>
    <path d="M12 40 L48 40 L42 16 L18 16 Z" fill="#1E293B"/>
    <rect x="16" y="8" width="28" height="12" rx="3" fill="#2563EB"/>
    <line x1="10" y1="14" x2="50" y2="14" stroke="#EF4444" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Central Cloud Sync Indicator -->
  <g transform="translate(260, 410)" opacity="0.85">
    <rect width="120" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#0AC79E"/>
    <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Cloud Live Sync</text>
  </g>
</svg>
