<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" width="100%" height="100%">
  <defs>
    <!-- Matte 3D Gradients with Upper-left lighting -->
    <linearGradient id="trolleyMetal" x1="160" y1="180" x2="480" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="trolleyHandle" x1="140" y1="180" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="oilBottleGrad" x1="280" y1="160" x2="340" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="ricePackGrad" x1="330" y1="140" x2="440" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="teaBoxGrad" x1="240" y1="200" x2="310" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow3DGrocery" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="320" cy="540" rx="200" ry="40" fill="#0F172A" opacity="0.08"/>

  <!-- Packaged Grocery Goods in Basket (Rendered before front wireframe) -->
  <g transform="translate(10, 10)">
    <!-- Rice Pack (5kg) -->
    <g transform="translate(340, 160)" filter="url(#softShadow3DGrocery)">
      <!-- Top Face -->
      <path d="M20 20 L75 0 L105 18 L50 38 Z" fill="#FFFFFF"/>
      <!-- Left Face -->
      <path d="M20 20 L50 38 L45 150 L15 130 Z" fill="url(#ricePackGrad)"/>
      <!-- Right Depth Face -->
      <path d="M50 38 L105 18 L100 130 L45 150 Z" fill="#CBD5E1"/>
      <!-- Rice Label Banner -->
      <path d="M25 60 L48 74 L46 110 L23 96 Z" fill="#2563EB"/>
      <text x="35" y="88" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RICE</text>
    </g>

    <!-- Soybean Oil Bottle (1L) -->
    <g transform="translate(270, 180)" filter="url(#softShadow3DGrocery)">
      <!-- Cap -->
      <rect x="26" y="0" width="16" height="18" rx="3" fill="#DC2626"/>
      <!-- Neck -->
      <path d="M22 18 L46 18 L54 36 L14 36 Z" fill="url(#oilBottleGrad)"/>
      <!-- Bottle Body -->
      <rect x="12" y="36" width="44" height="100" rx="8" fill="url(#oilBottleGrad)" opacity="0.9"/>
      <!-- Highlight Reflection -->
      <line x1="20" y1="45" x2="20" y2="120" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <!-- Label -->
      <rect x="12" y="70" width="44" height="32" fill="#FFFFFF"/>
      <text x="34" y="89" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#0F172A" text-anchor="middle">OIL 1L</text>
    </g>

    <!-- Tea Box (200g) -->
    <g transform="translate(210, 220)" filter="url(#softShadow3DGrocery)">
      <!-- Top Face -->
      <path d="M15 15 L55 0 L75 14 L35 29 Z" fill="#6EE7B7"/>
      <!-- Left Face -->
      <path d="M15 15 L35 29 L35 95 L15 81 Z" fill="url(#teaBoxGrad)"/>
      <!-- Right Face -->
      <path d="M35 29 L75 14 L75 80 L35 95 Z" fill="#047857"/>
      <text x="55" y="55" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TEA</text>
    </g>
  </g>

  <!-- 3D Grocery Trolley Structure -->
  <g filter="url(#softShadow3DGrocery)">
    <!-- Trolley Handle Bar -->
    <path d="M130 200 L210 240 L200 258 L120 218 Z" fill="url(#trolleyHandle)"/>
    <!-- Handle Support Struts -->
    <line x1="140" y1="210" x2="190" y2="330" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
    <line x1="200" y1="240" x2="250" y2="360" stroke="#334155" stroke-width="7" stroke-linecap="round"/>

    <!-- Trolley Basket Rim (Upper Frame) -->
    <path d="M180 300 L380 230 L500 280 L300 360 Z" fill="none" stroke="url(#trolleyMetal)" stroke-width="8" stroke-linejoin="round"/>
    <!-- Trolley Basket Base (Lower Frame) -->
    <path d="M220 400 L370 350 L450 380 L300 440 Z" fill="none" stroke="#64748B" stroke-width="6" stroke-linejoin="round"/>

    <!-- Basket Corner Posts -->
    <line x1="180" y1="300" x2="220" y2="400" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <line x1="380" y1="230" x2="370" y2="350" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <line x1="500" y1="280" x2="450" y2="380" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="360" x2="300" y2="440" stroke="#334155" stroke-width="7" stroke-linecap="round"/>

    <!-- Wireframe Mesh (Front & Left Faces) -->
    <!-- Front Face Horizontal Ribs -->
    <line x1="300" y1="380" x2="465" y2="310" stroke="#94A3B8" stroke-width="3"/>
    <line x1="300" y1="400" x2="460" y2="330" stroke="#94A3B8" stroke-width="3"/>
    <line x1="300" y1="420" x2="455" y2="355" stroke="#94A3B8" stroke-width="3"/>
    <!-- Front Face Vertical Slats -->
    <line x1="340" y1="345" x2="335" y2="425" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="380" y1="330" x2="375" y2="410" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="420" y1="315" x2="415" y2="395" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="460" y1="300" x2="440" y2="385" stroke="#CBD5E1" stroke-width="3"/>

    <!-- Left Face Ribs -->
    <line x1="195" y1="335" x2="300" y2="390" stroke="#64748B" stroke-width="3"/>
    <line x1="205" y1="365" x2="300" y2="415" stroke="#64748B" stroke-width="3"/>

    <!-- Lower Chassis Base Tube -->
    <path d="M200 450 L380 430 L430 460 L260 490 Z" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>

    <!-- 4 Heavy Duty Casters / Wheels -->
    <!-- Back-Left Wheel -->
    <g transform="translate(200, 470)">
      <circle cx="16" cy="16" r="16" fill="#334155"/>
      <circle cx="16" cy="16" r="8" fill="#E2E8F0"/>
    </g>
    <!-- Back-Right Wheel -->
    <g transform="translate(370, 450)">
      <circle cx="16" cy="16" r="16" fill="#1E293B"/>
      <circle cx="16" cy="16" r="8" fill="#CBD5E1"/>
    </g>
    <!-- Front-Left Wheel -->
    <g transform="translate(260, 500)">
      <circle cx="18" cy="18" r="18" fill="#0F172A"/>
      <circle cx="18" cy="18" r="9" fill="#2563EB"/>
    </g>
    <!-- Front-Right Wheel -->
    <g transform="translate(420, 475)">
      <circle cx="18" cy="18" r="18" fill="#0F172A"/>
      <circle cx="18" cy="18" r="9" fill="#2563EB"/>
    </g>
  </g>
</svg>
