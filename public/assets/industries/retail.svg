<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" width="100%" height="100%">
  <defs>
    <!-- Upper-left directional lighting and matte 3D gradients -->
    <linearGradient id="retailCounterTop" x1="120" y1="280" x2="520" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="retailCounterFront" x1="120" y1="360" x2="120" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="retailCounterSide" x1="480" y1="360" x2="560" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueBagGrad" x1="380" y1="180" x2="500" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="140" y1="100" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="softShadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="320" cy="530" rx="220" ry="45" fill="#0F172A" opacity="0.08"/>

  <!-- Back Shelves with Merchandise -->
  <g transform="translate(40, -10)">
    <!-- Wall Shelf Top -->
    <path d="M140 160 L380 160 L410 180 L170 180 Z" fill="url(#shelfGrad)"/>
    <!-- Shelf Thickness -->
    <path d="M140 160 L140 172 L170 192 L410 192 L410 180 L170 180 Z" fill="#94A3B8"/>
    <path d="M170 180 L410 180 L410 192 L170 192 Z" fill="#64748B"/>
    <!-- Brackets -->
    <rect x="180" y="192" width="10" height="40" rx="3" fill="#334155"/>
    <rect x="360" y="192" width="10" height="40" rx="3" fill="#334155"/>
    <!-- Items on Shelves -->
    <rect x="195" y="115" width="45" height="45" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M205 130 L230 130" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <rect x="250" y="95" width="55" height="65" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="315" y="125" width="50" height="35" rx="5" fill="#E2E8F0"/>
  </g>

  <!-- Compact Shop Counter (3D Isometric) -->
  <g filter="url(#softShadow3D)">
    <!-- Counter Top Face -->
    <path d="M160 320 L400 240 L520 290 L280 370 Z" fill="url(#retailCounterTop)"/>
    <!-- Front Face -->
    <path d="M160 320 L280 370 L280 500 L160 450 Z" fill="url(#retailCounterFront)"/>
    <!-- Right Side Face -->
    <path d="M280 370 L520 290 L520 420 L280 500 Z" fill="url(#retailCounterSide)"/>

    <!-- Subtle Feature Inset on Counter Front -->
    <path d="M180 345 L260 380 L260 475 L180 440 Z" fill="#0F172A" opacity="0.6"/>
    <line x1="195" y1="365" x2="245" y2="385" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Retail Shopping Bag (Matte 3D, Upper-left lighted) -->
  <g transform="translate(330, 160)" filter="url(#softShadow3D)">
    <!-- Bag Handle Behind -->
    <path d="M45 40 C45 0 95 0 95 40" stroke="#1D4ED8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Bag Body - Left Lit Face -->
    <path d="M20 45 L120 25 L140 170 L40 190 Z" fill="url(#blueBagGrad)"/>
    <!-- Bag Body - Right Side Depth Face -->
    <path d="M120 25 L165 40 L185 185 L140 170 Z" fill="#1E40AF"/>
    <!-- Bag Top Rim / Fold -->
    <path d="M20 45 L120 25 L165 40 L65 60 Z" fill="#60A5FA" opacity="0.3"/>
    <!-- Bag Handle Front -->
    <path d="M35 55 C35 15 85 15 85 55" stroke="#93C5FD" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- SortPi Tag on Bag -->
    <g transform="translate(75, 95) rotate(8)">
      <rect width="36" height="48" rx="4" fill="#FFFFFF" filter="url(#softShadow3D)"/>
      <circle cx="18" cy="10" r="3" fill="#2563EB"/>
      <line x1="8" y1="22" x2="28" y2="22" stroke="#0F172A" stroke-width="2"/>
      <line x1="8" y1="30" x2="22" y2="30" stroke="#0AC79E" stroke-width="2"/>
      <text x="18" y="42" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#2563EB" text-anchor="middle">POS</text>
    </g>
  </g>

  <!-- Physical POS Terminal & Barcode Scanner on Counter -->
  <g transform="translate(200, 260)">
    <!-- Terminal Base -->
    <path d="M30 40 L70 25 L100 40 L60 55 Z" fill="#CBD5E1"/>
    <!-- Terminal Screen (Upright) -->
    <path d="M45 35 L85 20 L85 -15 L45 0 Z" fill="#0F172A"/>
    <!-- Display Glow -->
    <path d="M48 30 L82 17 L82 -10 L48 3 Z" fill="#2563EB" opacity="0.85"/>
  </g>
</svg>
