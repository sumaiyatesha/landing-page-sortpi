<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" width="100%" height="100%">
  <defs>
    <!-- Matte 3D Gradients with Upper-left lighting -->
    <linearGradient id="pharmShelfTop" x1="120" y1="360" x2="520" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pharmShelfFront" x1="120" y1="420" x2="120" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pharmShelfSide" x1="480" y1="380" x2="540" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="syrupBottleGrad" x1="330" y1="180" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="boxBlueGrad" x1="180" y1="200" x2="290" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="boxWhiteGrad" x1="260" y1="220" x2="350" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="softShadow3DPharm" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="320" cy="535" rx="210" ry="40" fill="#0F172A" opacity="0.08"/>

  <!-- Small Pharmacy Counter Shelf (3D Isometric) -->
  <g filter="url(#softShadow3DPharm)">
    <!-- Top Shelf Face -->
    <path d="M140 370 L380 290 L520 340 L280 420 Z" fill="url(#pharmShelfTop)"/>
    <!-- Front Face -->
    <path d="M140 370 L280 420 L280 490 L140 440 Z" fill="url(#pharmShelfFront)"/>
    <!-- Side Face -->
    <path d="M280 420 L520 340 L520 410 L280 490 Z" fill="url(#pharmShelfSide)"/>

    <!-- Subtle Teal Accent Stripe on Edge -->
    <path d="M140 370 L280 420 L520 340 L520 346 L280 426 L140 376 Z" fill="#0AC79E"/>
  </g>

  <!-- Medicine Bottle (3D Matte Cylinder) -->
  <g transform="translate(350, 180)" filter="url(#softShadow3DPharm)">
    <!-- Cap (White Ribbed) -->
    <rect x="25" y="0" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="32" y1="4" x2="32" y2="18" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="40" y1="4" x2="40" y2="18" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="48" y1="4" x2="48" y2="18" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Neck -->
    <path d="M20 22 L60 22 L70 42 L10 42 Z" fill="#0E7490"/>
    <!-- Bottle Body -->
    <rect x="10" y="42" width="60" height="130" rx="10" fill="url(#syrupBottleGrad)"/>
    <!-- Light Reflection on Glass -->
    <line x1="20" y1="52" x2="20" y2="155" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Label -->
    <rect x="10" y="80" width="60" height="55" fill="#FFFFFF"/>
    <!-- Pharmacy Cross on Bottle Label -->
    <rect x="34" y="92" width="12" height="28" rx="2" fill="#0AC79E"/>
    <rect x="26" y="100" width="28" height="12" rx="2" fill="#0AC79E"/>
  </g>

  <!-- Neutral Medicine Box 1 (Blue Primary Box, 3D Isometric) -->
  <g transform="translate(180, 220)" filter="url(#softShadow3DPharm)">
    <!-- Top Face -->
    <path d="M20 30 L80 0 L130 20 L70 50 Z" fill="#93C5FD"/>
    <!-- Left Face -->
    <path d="M20 30 L70 50 L70 170 L20 150 Z" fill="url(#boxBlueGrad)"/>
    <!-- Right Depth Face -->
    <path d="M70 50 L130 20 L130 140 L70 170 Z" fill="#1D4ED8"/>

    <!-- Neutral Brand Mark -->
    <circle cx="45" cy="85" r="12" fill="#FFFFFF" opacity="0.8"/>
    <line x1="30" y1="110" x2="60" y2="110" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="122" x2="55" y2="122" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Neutral Medicine Box 2 (Warm White Box, Overlapping) -->
  <g transform="translate(265, 270)" filter="url(#softShadow3DPharm)">
    <!-- Top Face -->
    <path d="M15 25 L65 0 L105 18 L55 43 Z" fill="#FFFFFF"/>
    <!-- Left Face -->
    <path d="M15 25 L55 43 L55 135 L15 117 Z" fill="url(#boxWhiteGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Right Face -->
    <path d="M55 43 L105 18 L105 110 L55 135 Z" fill="#CBD5E1"/>

    <!-- Clean Label Bars -->
    <rect x="25" y="60" width="22" height="6" rx="2" fill="#0AC79E"/>
    <line x1="25" y1="75" x2="48" y2="75" stroke="#94A3B8" stroke-width="2"/>
    <line x1="25" y1="84" x2="42" y2="84" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Blister Pack / Tablet Strip on Shelf -->
  <g transform="translate(420, 310)" filter="url(#softShadow3DPharm) rotate(-8)">
    <rect width="65" height="42" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- 6 Capsule Bubble Pockets -->
    <ellipse cx="16" cy="14" rx="7" ry="5" fill="#E2E8F0"/>
    <ellipse cx="32" cy="14" rx="7" ry="5" fill="#E2E8F0"/>
    <ellipse cx="48" cy="14" rx="7" ry="5" fill="#E2E8F0"/>
    <ellipse cx="16" cy="28" rx="7" ry="5" fill="#2563EB" opacity="0.8"/>
    <ellipse cx="32" cy="28" rx="7" ry="5" fill="#2563EB" opacity="0.8"/>
    <ellipse cx="48" cy="28" rx="7" ry="5" fill="#2563EB" opacity="0.8"/>
  </g>
</svg>
