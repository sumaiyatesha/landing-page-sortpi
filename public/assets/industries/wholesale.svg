<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" width="100%" height="100%">
  <defs>
    <!-- Matte 3D Gradients with Upper-left lighting -->
    <linearGradient id="palletWoodTop" x1="120" y1="410" x2="520" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="palletWoodFront" x1="120" y1="460" x2="120" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cartonMainTop" x1="180" y1="180" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="cartonMainLeft" x1="180" y1="230" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cartonBlueTop" x1="280" y1="120" x2="480" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="cartonBlueLeft" x1="280" y1="160" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softShadow3DWholesale" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="320" cy="545" rx="225" ry="42" fill="#0F172A" opacity="0.08"/>

  <!-- Heavy Duty Wooden Pallet (3D Isometric Base) -->
  <g filter="url(#softShadow3DWholesale)">
    <!-- Pallet Top Deck Planks -->
    <path d="M120 440 L380 340 L520 400 L260 500 Z" fill="url(#palletWoodTop)"/>
    <!-- Front Edge -->
    <path d="M120 440 L260 500 L260 525 L120 465 Z" fill="url(#palletWoodFront)"/>
    <!-- Right Side Edge -->
    <path d="M260 500 L520 400 L520 425 L260 525 Z" fill="#1E293B"/>

    <!-- Pallet Forklift Slots (Front Cutouts) -->
    <path d="M145 460 L185 475 L185 490 L145 475 Z" fill="#0F172A"/>
    <path d="M205 482 L245 497 L245 512 L205 497 Z" fill="#0F172A"/>
    <!-- Pallet Forklift Slots (Side Cutouts) -->
    <path d="M295 490 L395 450 L395 465 L295 505 Z" fill="#0F172A"/>
    <path d="M420 440 L495 410 L495 425 L420 455 Z" fill="#0F172A"/>
  </g>

  <!-- Stacked Wholesale Cartons on Pallet -->
  <!-- Base Carton 1 (Left Front, Kraft / Gold) -->
  <g transform="translate(150, 270)" filter="url(#softShadow3DWholesale)">
    <!-- Top Face -->
    <path d="M15 35 L95 0 L165 25 L85 60 Z" fill="url(#cartonMainTop)"/>
    <!-- Left Face -->
    <path d="M15 35 L85 60 L85 160 L15 135 Z" fill="url(#cartonMainLeft)"/>
    <!-- Right Face -->
    <path d="M85 60 L165 25 L165 125 L85 160 Z" fill="#B45309"/>

    <!-- Packaging Sealing Tape -->
    <path d="M50 18 L60 14 L130 39 L120 43 Z" fill="#FDE68A" opacity="0.8"/>
    <!-- Barcode Shipping Label -->
    <rect x="28" y="70" width="38" height="48" rx="3" fill="#FFFFFF" transform="skewY(18)"/>
    <line x1="33" y1="88" x2="33" y2="108" stroke="#0F172A" stroke-width="2"/>
    <line x1="38" y1="89" x2="38" y2="109" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="43" y1="90" x2="43" y2="110" stroke="#0F172A" stroke-width="3"/>
    <line x1="48" y1="91" x2="48" y2="111" stroke="#0F172A" stroke-width="1.5"/>
  </g>

  <!-- Base Carton 2 (Right Back, Blue SortPi Branded) -->
  <g transform="translate(270, 210)" filter="url(#softShadow3DWholesale)">
    <!-- Top Face -->
    <path d="M20 35 L105 0 L180 27 L95 62 Z" fill="url(#cartonBlueTop)"/>
    <!-- Left Face -->
    <path d="M20 35 L95 62 L95 170 L20 143 Z" fill="url(#cartonBlueLeft)"/>
    <!-- Right Face -->
    <path d="M95 62 L180 27 L180 135 L95 170 Z" fill="#1E3A8A"/>

    <!-- SortPi Box Branding -->
    <text x="58" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" transform="skewY(19)">SortPi</text>
    <rect x="35" y="125" width="45" height="4" fill="#93C5FD" transform="skewY(19)"/>
  </g>

  <!-- Top Stacked Carton (Resting on top) -->
  <g transform="translate(210, 130)" filter="url(#softShadow3DWholesale)">
    <!-- Top Face -->
    <path d="M15 30 L85 0 L150 24 L80 54 Z" fill="#FFFFFF"/>
    <!-- Left Face -->
    <path d="M15 30 L80 54 L80 130 L15 106 Z" fill="#E2E8F0"/>
    <!-- Right Face -->
    <path d="M80 54 L150 24 L150 100 L80 130 Z" fill="#CBD5E1"/>

    <!-- Fragile / Wholesale Label -->
    <rect x="25" y="55" width="40" height="20" rx="3" fill="#0AC79E" transform="skewY(19)"/>
    <text x="45" y="69" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#065F46" text-anchor="middle" transform="skewY(19)">BULK SKU</text>
  </g>

  <!-- Upright Stock Ledger Clipboard Beside Pallet -->
  <g transform="translate(390, 280)" filter="url(#softShadow3DWholesale) rotate(-5)">
    <!-- Clipboard Board -->
    <rect width="90" height="135" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <!-- Metal Clip at Top -->
    <rect x="28" y="-8" width="34" height="16" rx="4" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="45" cy="0" r="3" fill="#1E293B"/>
    <!-- Paper Sheet -->
    <rect x="8" y="14" width="74" height="112" rx="4" fill="#FFFFFF"/>
    <!-- Ledger Header Bar -->
    <rect x="14" y="22" width="62" height="8" rx="2" fill="#2563EB"/>
    <!-- Checklist / Balance Rows -->
    <circle cx="20" cy="40" r="3" fill="#0AC79E"/>
    <line x1="28" y1="40" x2="68" y2="40" stroke="#0F172A" stroke-width="2"/>
    <circle cx="20" cy="54" r="3" fill="#0AC79E"/>
    <line x1="28" y1="54" x2="68" y2="54" stroke="#0F172A" stroke-width="2"/>
    <circle cx="20" cy="68" r="3" fill="#0AC79E"/>
    <line x1="28" y1="68" x2="60" y2="68" stroke="#0F172A" stroke-width="2"/>
    <circle cx="20" cy="82" r="3" fill="#2563EB"/>
    <line x1="28" y1="82" x2="64" y2="82" stroke="#94A3B8" stroke-width="2"/>
    <!-- Total Balance Stamp -->
    <rect x="14" y="96" width="62" height="20" rx="3" fill="#FEF3C7"/>
    <text x="45" y="110" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#B45309" text-anchor="middle">SUPPLIER DUE</text>
  </g>
</svg>
