<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" width="100%" height="100%">
  <defs>
    <!-- Matte 3D Gradients with Upper-left lighting -->
    <linearGradient id="restCounterTop" x1="140" y1="280" x2="520" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="restCounterFront" x1="140" y1="360" x2="140" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="restCounterSide" x1="480" y1="360" x2="560" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="clocheDomeGrad" x1="280" y1="140" x2="420" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="180" y1="220" x2="260" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softShadow3DRest" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="320" cy="535" rx="220" ry="42" fill="#0F172A" opacity="0.08"/>

  <!-- Restaurant Order Counter (3D Isometric) -->
  <g filter="url(#softShadow3DRest)">
    <!-- Top Face -->
    <path d="M150 330 L390 240 L520 290 L280 380 Z" fill="url(#restCounterTop)"/>
    <!-- Front Face -->
    <path d="M150 330 L280 380 L280 500 L150 450 Z" fill="url(#restCounterFront)"/>
    <!-- Side Face -->
    <path d="M280 380 L520 290 L520 410 L280 500 Z" fill="url(#restCounterSide)"/>

    <!-- Counter Edge Molding Strip -->
    <path d="M150 330 L280 380 L520 290 L520 296 L280 386 L150 336 Z" fill="#2563EB"/>
  </g>

  <!-- Serving Plate / Cloche Dome (Matte 3D Upper-left lighted) -->
  <g transform="translate(310, 160)" filter="url(#softShadow3DRest)">
    <!-- Plate Rim Base -->
    <ellipse cx="90" cy="130" rx="85" ry="32" fill="#CBD5E1"/>
    <ellipse cx="90" cy="126" rx="80" ry="30" fill="#FFFFFF"/>
    <!-- Serving Cloche Dome -->
    <path d="M25 120 C25 50 155 50 155 120 Z" fill="url(#clocheDomeGrad)"/>
    <!-- Cloche Top Knob Handle -->
    <ellipse cx="90" cy="50" rx="14" ry="10" fill="#2563EB"/>
    <ellipse cx="90" cy="48" rx="10" ry="7" fill="#60A5FA"/>
    <!-- Light Highlight on Dome -->
    <path d="M45 105 C45 65 100 65 110 80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Ceramic Coffee / Beverage Cup with Saucer -->
  <g transform="translate(180, 240)" filter="url(#softShadow3DRest)">
    <!-- Saucer -->
    <ellipse cx="50" cy="90" rx="46" ry="16" fill="#CBD5E1"/>
    <ellipse cx="50" cy="88" rx="42" ry="14" fill="#FFFFFF"/>
    <!-- Cup Body -->
    <path d="M20 40 L80 40 L72 82 C72 86 64 90 50 90 C36 90 28 86 28 82 Z" fill="url(#cupGrad)"/>
    <!-- Cup Interior Rim & Coffee -->
    <ellipse cx="50" cy="40" rx="30" ry="10" fill="#1E293B"/>
    <ellipse cx="50" cy="42" rx="26" ry="8" fill="#78350F"/>
    <ellipse cx="46" cy="42" rx="14" ry="4" fill="#B45309" opacity="0.6"/>
    <!-- Cup Handle (Side) -->
    <path d="M74 48 C90 48 90 72 70 76" stroke="#1D4ED8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M74 48 C86 48 86 72 70 76" stroke="#93C5FD" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Rising Steam Swirls (Subtle, 2 lines) -->
    <path d="M42 28 C40 18 48 14 44 4" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M56 26 C54 16 62 12 58 2" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Printed Restaurant Bill / Receipt Slip -->
  <g transform="translate(430, 240)" filter="url(#softShadow3DRest) rotate(-6)">
    <rect width="55" height="85" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Tear Zigzag Edge at Bottom -->
    <path d="M0 85 L7 80 L14 85 L21 80 L28 85 L35 80 L42 85 L49 80 L55 85 Z" fill="#E2E8F0"/>
    <!-- Receipt Header Bar -->
    <rect x="8" y="10" width="39" height="7" rx="2" fill="#2563EB"/>
    <!-- Bill Lines -->
    <line x1="8" y1="26" x2="47" y2="26" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="36" x2="35" y2="36" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="46" x2="42" y2="46" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <!-- Total Stamp -->
    <rect x="8" y="58" width="39" height="15" rx="3" fill="#E6FAF5"/>
    <text x="27" y="69" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#065F46" text-anchor="middle">PAID</text>
  </g>
</svg>
